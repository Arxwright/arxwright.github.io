    h1 {
      display: flex;
      align-items: center;
      gap: 0.6em;

      letter-spacing: 0.14em;

    .tag { margin-bottom: 2rem; color: var(--muted); font-size: 1.1rem; }
    a { color: var(--mark); text-underline-offset: 3px; }

      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.875rem;
